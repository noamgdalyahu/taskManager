server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same job as Vite's dev proxy: the browser only ever talks to this origin, so there is no CORS.
  location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built files carry a content hash in their name, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: any other path is a client-side route, so serve the app shell.
  location / {
    try_files $uri /index.html;
  }
}
